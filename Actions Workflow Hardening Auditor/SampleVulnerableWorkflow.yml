name: sample
on:
  pull_request_target:
  issue_comment:
    types: [created]
env:
  ACTIONS_ALLOW_UNSECURE_COMMANDS: true
jobs:
  build:
    runs-on: self-hosted
    permissions: write-all
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: some-org/deploy-action@main
      - uses: actions/upload-artifact@v4
        with:
          name: out
          path: .
      - name: greet
        run: |
          echo "title is ${{ github.event.pull_request.title }}"
          echo "BRANCH=${{ github.head_ref }}" >> "$GITHUB_ENV"
          curl -fsSL https://example.com/install.sh | sudo bash
      - uses: actions/github-script@v7
        with:
          script: |
            core.info("${{ github.event.comment.body }}")
      # wfa-ignore: WFA001
      - run: echo "${{ github.event.issue.title }}"
      - run: echo "${{ contains(github.event.issue.title, 'x') }} ${{ github.event.pull_request.number }}"
  call:
    uses: some-org/shared/.github/workflows/ci.yml@v2
    secrets: inherit
